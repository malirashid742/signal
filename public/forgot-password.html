<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0F172A; --paper:#F7F7F5; --muted:#6B7280; --line:#E4E2DC; --text:#1A1D23; --removed:#B23A34; --added:#1F7A4D; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--text);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0 0 6px;}
  .wrap{max-width:400px;width:100%;padding:20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  input[type=email]{width:100%;padding:11px 14px;font-size:14px;border:1px solid #D8D5CC;border-radius:8px;background:var(--paper);}
  input:focus{outline:none;border-color:var(--ink);}
  .btn-primary{width:100%;margin-top:20px;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary:disabled{background:#A3A9B4;cursor:not-allowed;}
  .error-msg{font-size:13px;color:var(--removed);margin-top:10px;display:none;}
  .success-msg{font-size:13px;color:var(--added);margin-top:10px;display:none;}
  .footer-note{text-align:center;font-size:13px;color:var(--muted);margin-top:20px;}
  .footer-note a{color:var(--ink);font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub">Enter your account email — we'll send a reset link.</p>
    <label>Email address</label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="email" />
    <button class="btn-primary" id="sendBtn">Send reset link</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <div class="footer-note"><a href="/login.html">Back to log in</a></div>
  </div>
</div>
<script>
document.getElementById('sendBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const btn = document.getElementById('sendBtn');
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
  if (!email) { errorMsg.textContent = 'Email is required.'; errorMsg.style.display = 'block'; return; }
  btn.disabled = true;
  btn.textContent = 'Sending...';
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    successMsg.textContent = data.message || 'Check your email for a reset link.';
    successMsg.style.display = 'block';
  } catch (e) {
    errorMsg.textContent = 'Network error. Try again.';
    errorMsg.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  }
});
</script>
</body>
</html>
