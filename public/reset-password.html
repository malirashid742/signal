<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password — Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0F172A; --paper:#F7F7F5; --muted:#6B7280; --line:#E4E2DC; --text:#1A1D23; --removed:#B23A34; --added:#1F7A4D; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--text);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0 0 6px;}
  .wrap{max-width:400px;width:100%;padding:20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;margin-top:14px;}
  label:first-of-type{margin-top:0;}
  input[type=password]{width:100%;padding:11px 14px;font-size:14px;border:1px solid #D8D5CC;border-radius:8px;background:var(--paper);}
  input:focus{outline:none;border-color:var(--ink);}
  .btn-primary{width:100%;margin-top:20px;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary:disabled{background:#A3A9B4;cursor:not-allowed;}
  .error-msg{font-size:13px;color:var(--removed);margin-top:10px;display:none;}
  .success-msg{font-size:13px;color:var(--added);margin-top:10px;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Set a new password</h1>
    <p class="sub" id="subText">Enter a new password for your account.</p>
    <label>New password</label>
    <input type="password" id="password" placeholder="At least 6 characters" />
    <button class="btn-primary" id="saveBtn">Save new password</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
  </div>
</div>
<script>
// Supabase's recovery link lands here with the token in the URL fragment
// (#access_token=...&type=recovery) — never sent to a server automatically, so
// we read it client-side and pass it to our own endpoint explicitly.
function getAccessToken() {
  const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
  const params = new URLSearchParams(hash);
  return params.get('access_token');
}
const accessToken = getAccessToken();
if (!accessToken) {
  document.getElementById('subText').textContent = 'This reset link is invalid or expired. Request a new one from the login page.';
  document.getElementById('saveBtn').disabled = true;
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const btn = document.getElementById('saveBtn');
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';

  if (!password || password.length < 6) {
    errorMsg.textContent = 'Password must be at least 6 characters.';
    errorMsg.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken, newPassword: password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || 'Something went wrong.';
      errorMsg.style.display = 'block';
      return;
    }
    successMsg.textContent = 'Password updated. Redirecting to login...';
    successMsg.style.display = 'block';
    setTimeout(() => window.location.href = '/login.html', 1500);
  } catch (e) {
    errorMsg.textContent = 'Network error. Try again.';
    errorMsg.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save new password';
  }
});
</script>
</body>
</html>
