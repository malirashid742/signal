<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F172A; --paper:#F7F7F5; --amber:#E8A33D;
    --added:#1F7A4D; --removed:#B23A34; --muted:#6B7280; --line:#E4E2DC; --text:#1A1D23;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--text);background:var(--paper);animation:fadeIn 0.3s ease;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  header{background:var(--ink);color:#fff;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;}
  .logo{font-family:'Space Grotesk';font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;}
  .logo-mark{width:9px;height:9px;background:var(--amber);border-radius:2px;transform:rotate(45deg);}
  .back-link{color:#B6BDCB;font-size:13px;text-decoration:none;transition:color 0.15s;}
  .back-link:hover{color:#fff;}

  .wrap{max-width:640px;margin:40px auto;padding:0 20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:20px;animation:fadeIn 0.35s ease;transition:box-shadow 0.2s;}
  .card:hover{box-shadow:0 4px 16px rgba(15,23,42,0.06);}

  .avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:8px;}
  .avatar{width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:20px;transition:transform 0.2s;}
  .avatar:hover{transform:scale(1.05);}
  .avatar-name{font-size:18px;font-weight:600;}
  .avatar-plan{display:inline-block;margin-top:4px;font-size:11px;background:#1E293B;color:#B6BDCB;padding:3px 10px;border-radius:12px;}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;margin-top:16px;}
  label:first-of-type{margin-top:20px;}
  input[type=text],input[type=email],select{width:100%;padding:11px 14px;font-size:14px;font-family:'Inter';border:1px solid #D8D5CC;border-radius:8px;background:var(--paper);transition:border-color 0.15s;}
  input:focus,select:focus{outline:none;border-color:var(--ink);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .btn-primary{margin-top:22px;padding:11px 22px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s, transform 0.1s;}
  .btn-primary:hover{background:#1E293B;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{background:#A3A9B4;cursor:not-allowed;}

  .save-msg{font-size:13px;color:var(--added);margin-top:12px;opacity:0;transition:opacity 0.3s;}
  .save-msg.show{opacity:1;}

  .section-title{font-size:14px;font-weight:600;margin:0 0 4px;}
  .section-sub{font-size:12px;color:var(--muted);margin:0 0 16px;}

  .invite-row{display:flex;gap:10px;}
  .invite-row input{flex:1;}
  .invite-row button{padding:0 18px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background 0.15s, transform 0.1s;}
  .invite-row button:hover{background:#1E293B;}
  .invite-row button:active{transform:scale(0.98);}
  .invite-row button:disabled{background:#A3A9B4;cursor:not-allowed;}
  .team-list{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .team-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px;}
  .team-status{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:600;}
  .team-status.pending{background:#FDF0D9;color:#9A6B16;}
  .team-status.active{background:#E3F3E9;color:var(--added);}
  .team-remove{background:none;border:none;color:var(--removed);font-size:12px;cursor:pointer;padding:4px 6px;}
  .team-remove:hover{text-decoration:underline;}
  .team-note{font-size:12px;color:var(--muted);margin-top:10px;}
  .upsell{background:#FDF0D9;border:1px solid #F0D9A8;border-radius:8px;padding:12px 14px;font-size:13px;color:#7A5410;}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-mark"></span>Signal</div>
  <a href="/dashboard.html" class="back-link">← Back to dashboard</a>
</header>

<div class="wrap">
  <div class="card">
    <div class="avatar-row">
      <div class="avatar" id="avatarInitials">–</div>
      <div>
        <div class="avatar-name" id="displayName">Your Profile</div>
        <div class="avatar-plan" id="planBadge">Free plan</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Personal details</div>
    <div class="section-sub">Used for alert emails and your dashboard display name.</div>

    <div class="row2">
      <div>
        <label>First name</label>
        <input type="text" id="firstName" placeholder="Muhammad" />
      </div>
      <div>
        <label>Last name</label>
        <input type="text" id="lastName" placeholder="Ali" />
      </div>
    </div>

    <label>Email address</label>
    <input type="email" id="email" placeholder="you@company.com" disabled style="background:#EFEDE7;color:#6B7280;cursor:not-allowed;" title="Email is set at signup and can't be changed here." />

    <label>Time zone</label>
    <select id="timezone">
      <option value="UTC">UTC</option>
      <option value="Asia/Karachi">Asia/Karachi</option>
      <option value="America/New_York">America/New_York</option>
      <option value="America/Los_Angeles">America/Los_Angeles</option>
      <option value="Europe/London">Europe/London</option>
      <option value="Asia/Dubai">Asia/Dubai</option>
      <option value="Asia/Kolkata">Asia/Kolkata</option>
    </select>

    <button class="btn-primary" id="saveBtn">Save changes</button>
    <div class="save-msg" id="saveMsg">Saved ✓</div>
  </div>

  <div class="card" id="teamCard">
    <div class="section-title">Team seats</div>
    <div class="section-sub">Invite teammates to see and manage your monitored pages.</div>
    <div id="teamBody">Loading...</div>
  </div>
</div>

<script>
async function loadProfile() {
  const res = await fetch('/api/profile');
  const p = await res.json();
  document.getElementById('firstName').value = p.firstName || '';
  document.getElementById('lastName').value = p.lastName || '';
  document.getElementById('email').value = p.email || '';
  document.getElementById('timezone').value = p.timezone || 'UTC';
  document.getElementById('planBadge').textContent = (p.plan || 'Free') + ' plan';
  updateAvatar(p);
  loadTeam(p.plan === 'Pro');
}

function escapeHtml(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadTeam(isPro) {
  const body = document.getElementById('teamBody');
  if (!isPro) {
    body.innerHTML = `<div class="upsell">Team seats are a Pro feature. Upgrade to invite up to 3 teammates to your workspace.</div>`;
    return;
  }
  try {
    const res = await fetch('/api/team');
    const data = await res.json();
    let html = `
      <div class="invite-row">
        <input type="email" id="inviteEmail" placeholder="teammate@company.com" />
        <button id="inviteBtn">Invite</button>
      </div>`;
    if (data.members && data.members.length) {
      html += `<div class="team-list">` + data.members.map(m => `
        <div class="team-row">
          <span>${escapeHtml(m.email)}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="team-status ${m.status}">${m.status === 'active' ? 'Active' : 'Pending'}</span>
            <button class="team-remove" onclick="removeTeamMember('${m.id}')">Remove</button>
          </span>
        </div>`).join('') + `</div>`;
    }
    html += `<div class="team-note">${(data.members || []).length}/3 seats used</div>`;
    if (data.memberOf && data.memberOf.length) {
      html += `<div class="team-note">You're also a member of ${data.memberOf.length} other team${data.memberOf.length > 1 ? 's' : ''} — their shared pages show up on your dashboard.</div>`;
    }
    body.innerHTML = html;
    document.getElementById('inviteBtn').addEventListener('click', inviteTeamMember);
  } catch (e) {
    body.innerHTML = `<div class="team-note">Couldn't load team.</div>`;
  }
}

async function inviteTeamMember() {
  const input = document.getElementById('inviteEmail');
  const btn = document.getElementById('inviteBtn');
  const email = input.value.trim();
  if (!email) return;
  btn.disabled = true;
  btn.textContent = 'Inviting...';
  try {
    const res = await fetch('/api/team/invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Could not invite.'); }
    loadTeam(true);
  } catch (e) {
    alert('Network error.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Invite';
  }
}

async function removeTeamMember(id) {
  if (!confirm('Remove this teammate? They will lose access to your pages.')) return;
  try {
    await fetch('/api/team/' + id, { method: 'DELETE' });
    loadTeam(true);
  } catch (e) {
    alert('Network error.');
  }
}

function updateAvatar(p) {
  const initials = ((p.firstName || '')[0] || '') + ((p.lastName || '')[0] || '');
  document.getElementById('avatarInitials').textContent = initials.toUpperCase() || '–';
  const name = [p.firstName, p.lastName].filter(Boolean).join(' ');
  document.getElementById('displayName').textContent = name || 'Your Profile';
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('saveMsg');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  const payload = {
    firstName: document.getElementById('firstName').value.trim(),
    lastName: document.getElementById('lastName').value.trim(),
    email: document.getElementById('email').value.trim(),
    timezone: document.getElementById('timezone').value,
  };
  try {
    const res = await fetch('/api/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (res.ok) {
      updateAvatar(data.profile);
      msg.textContent = 'Saved ✓';
      msg.classList.add('show');
      setTimeout(() => msg.classList.remove('show'), 2000);
    } else {
      msg.textContent = data.error || 'Error saving';
      msg.style.color = 'var(--removed)';
      msg.classList.add('show');
    }
  } catch (e) {
    msg.textContent = 'Network error';
    msg.style.color = 'var(--removed)';
    msg.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save changes';
  }
});

(async function initProfile() {
  try {
    const res = await fetch('/api/auth/session');
    const data = await res.json();
    if (!data.authenticated) { window.location.href = '/login.html'; return; }
  } catch (e) {}
  loadProfile();
})();
</script>

</body>
</html>
