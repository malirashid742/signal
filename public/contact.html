<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0F172A;--paper:#F7F7F5;--amber:#E8A33D;--muted:#6B7280;--line:#E4E2DC;--text:#1A1D23;--added:#1F7A4D;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:560px;margin:0 auto;padding:0 24px;}
  nav{max-width:1040px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;}
  .logo{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .logo-mark{width:10px;height:10px;background:var(--amber);border-radius:2px;transform:rotate(45deg);}
  .nav-links{display:flex;gap:28px;font-size:14px;font-weight:500;color:var(--muted);}
  .nav-links a:hover{color:var(--ink);}
  main{padding:56px 0 80px;}
  h1{font-size:32px;margin:0 0 12px;}
  p.sub{font-size:15px;color:var(--muted);margin:0 0 32px;}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;}
  input[type=text],input[type=email],textarea{width:100%;padding:12px 14px;font-size:14px;font-family:'Inter';border:1px solid #D8D5CC;border-radius:8px;background:#fff;margin-bottom:18px;}
  textarea{min-height:120px;resize:vertical;}
  button{padding:12px 22px;font-size:15px;font-weight:600;background:var(--ink);color:#fff;border:none;border-radius:8px;cursor:pointer;}
  button:hover{background:#1E293B;}
  button:disabled{background:#A3A9B4;cursor:not-allowed;}
  #formMsg{margin-top:14px;font-size:14px;}
  footer{border-top:1px solid var(--line);padding:32px 0;font-size:13px;color:var(--muted);max-width:1040px;margin:0 auto;padding-left:24px;padding-right:24px;}
  footer a{margin-right:16px;color:var(--muted);text-decoration:underline;}
</style>
</head>
<body>

<div id="sg-header-mount"></div>

<div class="wrap">
  <main>
    <h1>Get in touch</h1>
    <p class="sub">Bug, feature idea, or just want to say hi — send it here.</p>

    <form id="contactForm">
      <label for="name">Name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="message">Message</label>
      <textarea id="message" required></textarea>

      <button type="submit" id="sendBtn">Send message</button>
      <div id="formMsg"></div>
    </form>
  </main>
</div>

<div id="sg-footer-mount"></div>

<script src="/shared-nav.js"></script>

<script>
document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('sendBtn');
  const msg = document.getElementById('formMsg');
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();

  btn.disabled = true;
  btn.textContent = 'Sending...';
  msg.textContent = '';

  try {
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, message }),
    });
    const data = await res.json();
    if (res.ok) {
      msg.style.color = '#1F7A4D';
      msg.textContent = "Thanks — we'll get back to you soon.";
      document.getElementById('contactForm').reset();
    } else {
      msg.style.color = '#B23A34';
      msg.textContent = data.error || 'Something went wrong.';
    }
  } catch (e) {
    msg.style.color = '#B23A34';
    msg.textContent = 'Network error. Try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send message';
  }
});
</script>

</body>
</html>
